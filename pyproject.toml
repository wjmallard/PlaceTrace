[project]
name = "placetrace"
version = "0.1.0"
description = "Personal location history explorer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-cors>=4.0",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg>=3.2",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "tqdm>=4.66",
]

[project.scripts]
pt = "placetrace.cli:main"
pt-web = "placetrace.web:main"
pt-ingest = "placetrace.pipeline.ingest:main"
pt-import-visits = "placetrace.pipeline.import_visits:main"
pt-import-movements = "placetrace.pipeline.import_movements:main"
pt-geocode = "placetrace.pipeline.geocode:main"
pt-detect-trips = "placetrace.pipeline.detect_trips:main"
pt-find-places = "placetrace.places.find:main"
pt-manage-places = "placetrace.places.manage:main"
pt-query = "placetrace.places.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placetrace"]
