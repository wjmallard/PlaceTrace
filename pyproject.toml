[project]
name = "location-history"
version = "0.1.0"
description = "Personal location history explorer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "psycopg>=3.3.4",
    "pyyaml>=6.0.3",
    "orjson>=3.11.9",
    "tqdm>=4.69.1",
]

[project.scripts]
pt = "location_history.cli:main"
pt-web = "location_history.web:main"
pt-ingest = "location_history.pipeline.ingest:main"
pt-import-visits = "location_history.pipeline.import_visits:main"
pt-import-movements = "location_history.pipeline.import_movements:main"
pt-import-arc = "location_history.pipeline.import_arc:main"
pt-geocode = "location_history.pipeline.geocode:main"
pt-detect-trips = "location_history.pipeline.detect_trips:main"
pt-find-places = "location_history.places.find:main"
pt-manage-places = "location_history.places.manage:main"
pt-query = "location_history.places.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/location_history"]
