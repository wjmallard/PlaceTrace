[project]
name = "placetrace"
version = "0.1.0"
description = "Personal location history and photo archive explorer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-cors>=4.0",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg>=3.2",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "tqdm>=4.66",
    "pillow>=10.0",
    "timezonefinder>=6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placetrace"]
