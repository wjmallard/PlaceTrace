# Unified Location & Photo Archive Configuration

# Database Settings
databases:
  main: placetrace                 # Main database
  osm: osm_boundaries              # OSM boundaries for geocoding

# Source Data
source_data:
  location_history_json: /path/to/location-history.json
  photo_directories:
    - /path/to/photos
  thumbnails_directory: /path/to/thumbnails

# Photo Visit Creation Settings
photo_visits:
  time_window_minutes: 30           # Cluster photos within this time window
  distance_threshold_meters: 5      # Photos within this distance are same session
  visit_match_time_buffer_minutes: 15   # Buffer when matching to existing visits
  visit_match_distance_meters: 100      # Distance to match with existing visit

# Trip Detection Settings
trips:
  day_trip_min_hours: 4
  day_trip_max_hours: 16
  short_trip_max_days: 4
  long_trip_min_days: 4
  home_buffer_km: 50                # Must be this far from home to be a trip
  trip_gap_hours: 2                 # Gap between visits to end trip

# Processing Settings
processing:
  num_workers: 16  # Number of parallel workers for photo processing

# Map Display Settings
map:
  height: 1200
  default_zoom: 12
  default_date_range_days: 7  # Default number of days to show
  tiles:
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
    attribution: 'Esri'

# Photo Gallery Settings (for web interface)
gallery:
  thumbnail_width: 250              # Width in pixels (maintains aspect ratio)
  default_recent_count: 100         # Number of recent photos to show by default
  photos_per_row: 4                 # Number of thumbnails per row in gallery

# Performance Settings (for web interface)
performance:
  cache_ttl_seconds: 300            # How long to cache database queries (5 minutes)
  max_points_default: 5000          # Default maximum points to display on map
  max_points_options:               # Available options in max points slider
    - 1000
    - 2500
    - 5000
    - 10000
    - 25000
