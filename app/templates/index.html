<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceTrace</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:,">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-screen overflow-hidden">
    <div x-data="placeTraceApp()" class="flex h-full">
        <!-- Sidebar -->
        <div class="w-80 bg-gray-50 border-r border-gray-200 flex flex-col">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">PlaceTrace</h1>
            </div>
            
            <!-- Selected Visit Panel -->
            <div class="p-4 border-b border-gray-200 bg-green-50">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-semibold text-gray-700 uppercase">Selected Visit</h3>
                    <button x-show="selectedVisit" @click="clearSelectedVisit()" class="text-xs text-gray-600 hover:text-gray-800">Clear</button>
                </div>
                
                <!-- Visit details when selected -->
                <template x-if="selectedVisit">
                    <div>
                        <div class="font-semibold text-sm text-gray-900 mb-1" x-text="selectedVisit.location_name"></div>
                        <div class="text-xs text-gray-600 mb-1">
                            <span x-text="formatLocalDate(selectedVisit.local_start_date, selectedVisit.local_start_time)"></span>
                            <span class="text-gray-400 mx-1">•</span>
                            <span x-text="formatLocalTime(selectedVisit.local_start_date, selectedVisit.local_start_time)"></span>
                            <span class="text-gray-400 mx-1">•</span>
                            <span x-text="`${selectedVisit.duration_minutes} min`"></span>
                        </div>
                        <div class="text-xs text-gray-500 mb-3">
                            <span x-text="selectedVisit.latitude.toFixed(5)"></span>, 
                            <span x-text="selectedVisit.longitude.toFixed(5)"></span>
                            <span class="text-gray-400 mx-1">•</span>
                            <span class="font-mono text-gray-400" x-text="encodeGeohash(selectedVisit.latitude, selectedVisit.longitude, 10)"></span>
                        </div>
                        
                        <!-- Time Filters -->
                        <div class="mb-2 text-xs">
                            <span class="font-medium text-gray-700">Time:</span>
                            <a href="#" @click.prevent="viewDay(selectedVisit.local_start_date)" class="text-blue-600 hover:underline ml-1">Day</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="view3Day(selectedVisit.local_start_date)" class="text-blue-600 hover:underline">3 Day</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewWeek(selectedVisit.local_start_date)" class="text-blue-600 hover:underline">Week</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewMonth(selectedVisit.local_start_date)" class="text-blue-600 hover:underline">Month</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewYear(selectedVisit.local_start_date)" class="text-blue-600 hover:underline">Year</a>
                        </div>
                        
                        <!-- Space Filters -->
                        <div class="text-xs">
                            <span class="font-medium text-gray-700">Space:</span>
                            <a href="#" @click.prevent="viewSpace(selectedVisit.latitude, selectedVisit.longitude, 2)" class="text-blue-600 hover:underline ml-1">2km</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewSpace(selectedVisit.latitude, selectedVisit.longitude, 5)" class="text-blue-600 hover:underline">5km</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewSpace(selectedVisit.latitude, selectedVisit.longitude, 10)" class="text-blue-600 hover:underline">10km</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewSpace(selectedVisit.latitude, selectedVisit.longitude, 20)" class="text-blue-600 hover:underline">20km</a>
                            <span class="text-gray-400 mx-1">•</span>
                            <a href="#" @click.prevent="viewSpace(selectedVisit.latitude, selectedVisit.longitude, 50)" class="text-blue-600 hover:underline">50km</a>
                        </div>
                    </div>
                </template>
                
                <!-- Placeholder when no visit selected -->
                <template x-if="!selectedVisit">
                    <div class="text-xs text-gray-500 italic">
                        Click a visit on the map to view details
                    </div>
                </template>
            </div>
            
            <!-- Active Filters -->
            <div x-show="activeFilters.length > 0" class="p-4 border-b border-gray-200 bg-blue-50">
                <h3 class="text-xs font-semibold text-gray-700 uppercase mb-2">Active Filters</h3>
                <div class="flex flex-wrap gap-2">
                    <template x-for="filter in activeFilters" :key="filter.id">
                        <div class="inline-flex items-center gap-1 bg-white px-3 py-1 rounded-full text-sm border border-gray-300">
                            <span x-text="filter.emoji"></span>
                            <span x-text="filter.label"></span>
                            <button @click="removeFilter(filter.id)" class="ml-1 text-gray-500 hover:text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Visit Table Toggle -->
            <div class="p-4 border-b border-gray-200">
                <div class="flex gap-2">
                    <button @click="showVisitTable = true; loadVisitTableData()" 
                            :disabled="showVisitTable"
                            class="flex-1 px-3 py-2 bg-gray-200 text-gray-800 rounded text-sm border border-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300">
                        Show Table
                    </button>
                    <button @click="clearAllFilters(); loadRecentVisits();" 
                            :disabled="activeFilters.length === 0"
                            class="flex-1 px-3 py-2 bg-gray-200 text-gray-800 rounded text-sm border border-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300">
                        Clear Filters
                    </button>
                </div>
            </div>
            
            <!-- Trip Selector -->
            <div class="flex-1 overflow-y-auto">
                <div class="p-4">
                    <!-- Movement Tracks (Collapsible) -->
                    <div class="mb-4 pb-4 border-b border-gray-200">
                        <button @click="showMovementSection = !showMovementSection" 
                                class="w-full flex items-center justify-between p-3 bg-gray-100 rounded hover:bg-gray-200 transition-colors">
                            <span class="text-sm font-semibold text-gray-700">⚡ Movements</span>
                            <span class="text-gray-600 font-bold" x-text="showMovementSection ? '−' : '+'"></span>
                        </button>
                        <div x-show="showMovementSection" x-collapse class="mt-3">
                            <!-- Show/hide toggle (above date picker) -->
                            <label class="flex items-center gap-2 cursor-pointer mb-3">
                                <input type="checkbox" 
                                       x-model="showMovement"
                                       @change="toggleMovement()"
                                       class="rounded">
                                <span class="text-sm">Show tracks</span>
                            </label>
                            
                            <!-- Day navigation (always visible, disabled when unchecked) -->
                            <div class="flex items-center gap-2 mb-3">
                                <button @click="prevDay()" 
                                        :disabled="!showMovement"
                                        class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    ←
                                </button>
                                <input type="date" 
                                       x-model="selectedDay"
                                       @change="loadMovements()"
                                       :disabled="!showMovement"
                                       class="flex-1 p-2 text-sm border border-gray-300 rounded disabled:bg-gray-100 disabled:cursor-not-allowed">
                                <button @click="nextDay()" 
                                        :disabled="!showMovement"
                                        class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    →
                                </button>
                            </div>
                            
                            <!-- Show all nearby visits toggle (always visible, disabled when tracks are off) -->
                            <label class="flex items-center gap-2 cursor-pointer"
                                   :class="!showMovement && 'opacity-50 cursor-not-allowed'">
                                <input type="checkbox"
                                       x-model="showAllNearbyVisits"
                                       @change="toggleShowAllNearbyVisits()"
                                       :disabled="!showMovement"
                                       class="rounded">
                                <span class="text-sm">Show all nearby visits</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Time Filters (Collapsible) -->
                    <div class="mb-4 pb-4 border-b border-gray-200">
                        <button @click="showDateFilter = !showDateFilter" 
                                class="w-full flex items-center justify-between p-3 bg-gray-100 rounded hover:bg-gray-200 transition-colors">
                            <span class="text-sm font-semibold text-gray-700">📅 Time Filters</span>
                            <span class="text-gray-600 font-bold" x-text="showDateFilter ? '−' : '+'"></span>
                        </button>
                        <div x-show="showDateFilter" x-collapse class="mt-2 p-4 bg-gray-50 rounded">
                            <!-- Enable checkbox -->
                            <div class="mb-3">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox"
                                           x-model="timeFilterEnabled"
                                           @change="toggleTimeFilter()"
                                           class="rounded">
                                    <span class="text-sm font-semibold">Enable</span>
                                </label>
                            </div>
                            
                            <!-- Start date -->
                            <div class="mb-2 flex items-center gap-1">
                                <label class="text-sm text-gray-700 w-12">Start</label>
                                <input type="date" 
                                       x-model="startDate"
                                       @change="onStartDateChange()"
                                       :disabled="!timeFilterEnabled"
                                       class="flex-1 p-2 text-sm border border-gray-300 rounded disabled:bg-gray-100 disabled:cursor-not-allowed">
                            </div>
                            
                            <!-- End date -->
                            <div class="mb-3 flex items-center gap-1">
                                <label class="text-sm text-gray-700 w-12">End</label>
                                <input type="date" 
                                       x-model="endDate"
                                       @change="onEndDateChange()"
                                       :disabled="!timeFilterEnabled"
                                       class="flex-1 p-2 text-sm border border-gray-300 rounded disabled:bg-gray-100 disabled:cursor-not-allowed">
                            </div>
                            
                            <!-- Quick preset buttons -->
                            <div class="flex flex-wrap gap-1">
                                <button @click="setPastWeek()" 
                                        class="text-xs px-2 py-1 bg-white border border-gray-300 rounded hover:bg-gray-50">
                                    Past Week
                                </button>
                                <button @click="setPastMonth()" 
                                        class="text-xs px-2 py-1 bg-white border border-gray-300 rounded hover:bg-gray-50">
                                    Past Month
                                </button>
                                <button @click="setPastYear()" 
                                        class="text-xs px-2 py-1 bg-white border border-gray-300 rounded hover:bg-gray-50">
                                    Past Year
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Space Filters (Collapsible) -->
                    <div class="mb-4 pb-4 border-b border-gray-200">
                        <button @click="showRadiusSection = !showRadiusSection" 
                                class="w-full flex items-center justify-between p-3 bg-gray-100 rounded hover:bg-gray-200 transition-colors">
                            <span class="text-sm font-semibold text-gray-700">📍 Space Filters</span>
                            <span class="text-gray-600 font-bold" x-text="showRadiusSection ? '−' : '+'"></span>
                        </button>
                        <div x-show="showRadiusSection" x-collapse class="mt-2 p-4 bg-gray-50 rounded">
                            <!-- Enable checkbox -->
                            <div class="mb-3">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox"
                                           x-model="spaceFilterEnabled"
                                           @change="toggleSpaceFilter()"
                                           class="rounded">
                                    <span class="text-sm font-semibold">Enable</span>
                                </label>
                            </div>
                            
                            <!-- Radius slider -->
                            <div class="mb-2 flex items-center gap-2">
                                <input type="range"
                                       min="0"
                                       max="6"
                                       step="1"
                                       :value="getRadiusSliderPosition()"
                                       @input="setRadiusFromSlider(Number($event.target.value))"
                                       :disabled="!spaceFilterEnabled"
                                       class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                                <span class="text-sm text-gray-700 min-w-[3rem] text-right" 
                                      x-text="filterManager.spatial.radius_km + ' km'"></span>
                            </div>
                            
                            <p class="text-xs text-gray-500 mt-3" 
                               x-show="filterManager.spatial.lat === null">💡 Click map to set center point</p>
                            <p class="text-xs text-gray-700 mt-3" 
                               x-show="filterManager.spatial.lat !== null"
                               x-text="'📍 ' + filterManager.spatial.lat?.toFixed(5) + ', ' + filterManager.spatial.lon?.toFixed(5) + '\u00A0\u00A0🔷 ' + encodeGeohash(filterManager.spatial.lat, filterManager.spatial.lon, 10)"></p>
                        </div>
                    </div>
                    
                    <!-- Trip Explorer (Collapsible) -->
                    <div class="mb-4 pb-4 border-b border-gray-200">
                        <button @click="showTripsSection = !showTripsSection"
                                class="w-full flex items-center justify-between p-3 bg-gray-100 rounded hover:bg-gray-200 transition-colors">
                            <span class="text-sm font-semibold text-gray-700">🗺️ Trip Explorer</span>
                            <span class="text-gray-600 font-bold" x-text="showTripsSection ? '−' : '+'"></span>
                        </button>
                        <div x-show="showTripsSection" x-collapse class="mt-3">
                            <!-- Trip Category Tabs -->
                            <div class="flex border-b border-gray-200 mb-4">
                                <button
                                    @click="activeTripTab = 'day'"
                                    :class="activeTripTab === 'day' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                    class="flex-1 py-2 px-1 text-center border-b-2 font-medium text-sm flex flex-col items-center">
                                    <span>Day Trips</span>
                                    <span class="mt-1">🚗 <span class="inline-block bg-gray-100 text-red-700 text-xs px-1 rounded" x-text="tripCounts.day"></span></span>
                                </button>
                                <button
                                    @click="activeTripTab = 'short'"
                                    :class="activeTripTab === 'short' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                    class="flex-1 py-2 px-1 text-center border-b-2 font-medium text-sm flex flex-col items-center">
                                    <span>Short Trips</span>
                                    <span class="mt-1">✈️ <span class="inline-block bg-gray-100 text-red-700 text-xs px-1 rounded" x-text="tripCounts.short"></span></span>
                                </button>
                                <button
                                    @click="activeTripTab = 'long'"
                                    :class="activeTripTab === 'long' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                    class="flex-1 py-2 px-1 text-center border-b-2 font-medium text-sm flex flex-col items-center">
                                    <span>Long Trips</span>
                                    <span class="mt-1">🌍 <span class="inline-block bg-gray-100 text-red-700 text-xs px-1 rounded" x-text="tripCounts.long"></span></span>
                                </button>
                            </div>
                            
                            <!-- Trip List (Conditional: Grouped by Year or Flat) -->
                            <div class="space-y-3">
                        <!-- Year-grouped view (multi-year) -->
                        <template x-if="shouldShowYearGrouping">
                            <div class="space-y-3">
                                <template x-for="yearGroup in tripsByYear" :key="yearGroup.year">
                                    <div>
                                        <!-- Year Header -->
                                        <button @click="toggleYear(yearGroup.year)"
                                                class="w-full flex items-center justify-between p-2 bg-gray-100 rounded hover:bg-gray-200 transition-colors">
                                            <span class="text-sm font-semibold text-gray-700" x-text="yearGroup.year + ' (' + yearGroup.count + ' trips)'"></span>
                                            <span class="text-gray-600 font-bold" x-text="expandedYears[yearGroup.year] ? '−' : '+'"></span>
                                        </button>
                                        
                                        <!-- Trips for this year -->
                                        <div x-show="expandedYears[yearGroup.year]" x-collapse class="mt-2 space-y-2">
                                            <template x-for="trip in yearGroup.trips" :key="trip.id">
                                                <button
                                                    @click="selectTrip(trip)"
                                                    :class="filterManager.tripId === trip.id ? 'bg-blue-100 border-blue-500' : 'bg-white border-gray-200 hover:bg-gray-50'"
                                                    class="w-full text-left p-3 rounded-lg border transition-colors">
                                                    <div class="font-medium text-gray-900" x-text="trip.display_name"></div>
                                                    <div class="text-xs text-gray-600 mt-1">
                                                        <span x-text="formatDateRange(trip.local_start_date, trip.local_end_date)"></span>
                                                    </div>
                                                    <div class="text-xs text-gray-500 mt-1">
                                                        <span x-text="trip.visit_count + ' visits · ' + trip.photo_count + ' photos'"></span>
                                                    </div>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        
                        <!-- Flat list view (single year) -->
                        <template x-if="!shouldShowYearGrouping">
                            <div class="space-y-2">
                                <template x-for="trip in filteredTrips" :key="trip.id">
                                    <button
                                        @click="selectTrip(trip)"
                                        :class="filterManager.tripId === trip.id ? 'bg-blue-100 border-blue-500' : 'bg-white border-gray-200 hover:bg-gray-50'"
                                        class="w-full text-left p-3 rounded-lg border transition-colors">
                                        <div class="font-medium text-gray-900" x-text="trip.display_name"></div>
                                        <div class="text-xs text-gray-600 mt-1">
                                            <span x-text="formatDateRange(trip.local_start_date, trip.local_end_date)"></span>
                                        </div>
                                        <div class="text-xs text-gray-500 mt-1">
                                            <span x-text="trip.visit_count + ' visits · ' + trip.photo_count + ' photos'"></span>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </template>
                        
                        <div x-show="filteredTrips.length === 0" class="text-sm text-gray-500 text-center py-4">
                            No trips in this category
                        </div>
                    </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Stats Footer -->
            <div class="p-4 border-t border-gray-200 bg-white">
                <div class="text-sm text-gray-600">
                    <div x-show="!loading">
                        <span class="font-semibold" x-text="visits.length"></span> visits shown
                    </div>
                    <div x-show="loading" class="text-blue-600">
                        Loading...
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Loading Overlay -->
            <div x-show="loading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-[1000]">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="mt-2 text-gray-600">Loading visits...</p>
                </div>
            </div>
        </div>
        
        <!-- Visit Table Panel - Absolute positioned overlay -->
        <div x-show="showVisitTable" 
             class="fixed bottom-0 left-80 right-0 h-1/3 border-t-2 border-gray-300 bg-white z-[900] flex flex-col">
            
            <!-- Table Header -->
            <div class="flex items-center justify-between p-3 border-b border-gray-200 bg-gray-50">
                <div class="flex items-center gap-2">
                    <h3 class="text-sm font-semibold text-gray-700">
                        Visit Table
                        <span class="text-gray-500 font-normal" x-text="'(' + visitTableData.length + ' visits)'"></span>
                    </h3>
                    <span x-show="isViewportLimited()" class="text-xs text-amber-600">
                        ⚠️ Viewport only
                    </span>
                </div>
                <button @click="showVisitTable = false" 
                        class="text-gray-500 hover:text-gray-700 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Table -->
            <div class="flex-1 overflow-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="px-2 py-2 text-center">🧭</th>
                            <th @click="sortVisitTable('location_name')" 
                                class="px-3 py-2 text-left cursor-pointer hover:bg-gray-200">
                                Location <span x-show="visitTableSort.column === 'location_name'" 
                                               x-text="visitTableSort.ascending ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-3 py-2 text-left">Geohash</th>
                            <th @click="sortVisitTable('local_start_date')" 
                                class="px-3 py-2 text-left cursor-pointer hover:bg-gray-200">
                                Date <span x-show="visitTableSort.column === 'local_start_date'" 
                                           x-text="visitTableSort.ascending ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-3 py-2 text-left">Time</th>
                            <th @click="sortVisitTable('duration_minutes')" 
                                class="px-3 py-2 text-left cursor-pointer hover:bg-gray-200">
                                Duration <span x-show="visitTableSort.column === 'duration_minutes'" 
                                               x-text="visitTableSort.ascending ? '↑' : '↓'"></span>
                            </th>
                            <th @click="sortVisitTable('photo_count')" 
                                class="px-3 py-2 text-left cursor-pointer hover:bg-gray-200">
                                Photos <span x-show="visitTableSort.column === 'photo_count'" 
                                             x-text="visitTableSort.ascending ? '↑' : '↓'"></span>
                            </th>
                            <th class="px-3 py-2 text-left">Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="visit in visitTableSortedData" :key="visit.id">
                            <tr :id="'table-visit-' + visit.id"
                                @click="selectVisitFromTable(visit)" 
                                class="border-b border-gray-200 hover:bg-blue-50 cursor-pointer"
                                :class="selectedVisit?.id === visit.id ? 'bg-blue-100' : ''">
                                <td class="px-2 py-2 text-center" x-text="getVisitDirection(visit)"></td>
                                <td class="px-3 py-2" x-text="visit.location_name"></td>
                                <td class="px-3 py-2 text-xs font-mono" x-text="encodeGeohash(visit.latitude, visit.longitude, 10)"></td>
                                <td class="px-3 py-2" x-text="visit.local_start_date"></td>
                                <td class="px-3 py-2" x-text="formatTime(visit.local_start_time)"></td>
                                <td class="px-3 py-2" x-text="formatDuration(visit.duration_minutes)"></td>
                                <td class="px-3 py-2" x-text="visit.photo_count"></td>
                                <td class="px-3 py-2 text-xs" x-text="visit.semantic_type || '-'"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Alpine.js -->
